name: Descargar imágenes a public/imagenes-club

# Ejecuta scripts/fetch-images.mjs (descarga las imágenes que hoy están en
# Supabase Storage) y commitea el resultado en public/imagenes-club y
# public/documentos. Correr una sola vez: Actions > "Descargar imágenes a
# public/imagenes-club" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch images from Supabase
        run: node scripts/fetch-images.mjs

      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/imagenes-club public/documentos
          if git diff --cached --quiet; then
            echo "No hay cambios en las imágenes."
          else
            git commit -m "chore: descargar imágenes a public/imagenes-club"
            git push
          fi
